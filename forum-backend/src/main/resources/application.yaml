spring:
  application:
    name: forum-backend
  datasource:
    url: jdbc:postgresql://forum_postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: true