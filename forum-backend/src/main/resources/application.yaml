spring:
  application:
    name: forum-backend
  datasource:
    url: jdbc:postgresql://forum_postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  devtools:
    restart:
      # poll-interval: 2s
      # quiet-period: 1s
      enabled: true
#      enabled: false
    livereload:
      enabled: true
forum:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      expirySeconds: ${JWT_EXPIRY}
    cookies:
      name: ${COOKIE_NAME}
      domain: ${COOKIE_DOMAIN}
      expiresAfterSeconds: ${JWT_EXPIRY}